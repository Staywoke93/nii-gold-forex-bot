name: nii-gold-forex-bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 8-10 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install yfinance pandas requests
      - name: Run bot
        run: python bot.py
